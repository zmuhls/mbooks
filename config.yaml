# Muhlbauer Books LLC - Collectible Books Management System
# Configuration file for LLM extraction, eBay integration, and website deployment

app:
  name: "Muhlbauer Books LLC"
  version: "1.0.0"
  environment: "development"  # development, staging, production

# Directory structure
paths:
  listings_dir: "./listings"
  archive_dir: "./archive"
  exports_dir: "./exports"
  images_dir: "./images"
  website_dir: "./site"

# LLM Vision Extraction Settings
vision:
  provider: "anthropic"  # anthropic, openai, local
  model: "claude-sonnet-4-5-20250929"
  max_images_per_request: 5
  extraction_prompts:
    book_metadata: |
      Analyze this book image and extract all visible metadata.
      Return a JSON object with these fields:
      - title, subtitle, author, editor, illustrator
      - publisher, publication_year, isbn
      - edition_info, copy_number, limitation_statement
      - binding_type, binding_color, format
      - signatures_visible, signature_details
      - condition_observations, special_features
      - any visible text on spine, cover, or pages

    condition_assessment: |
      Assess the condition of this book from the image.
      Note any visible wear, damage, or special features.
      Rate overall condition: NEW, LIKE_NEW, VERY_GOOD, GOOD, ACCEPTABLE
      List specific observations about covers, spine, pages, dust jacket.

# eBay Integration
ebay:
  environment: "sandbox"  # sandbox, production
  api_version: "v1"

  # OAuth credentials (set via environment variables)
  credentials:
    client_id_env: "EBAY_CLIENT_ID"
    client_secret_env: "EBAY_CLIENT_SECRET"
    refresh_token_env: "EBAY_REFRESH_TOKEN"

  # API endpoints
  endpoints:
    sandbox:
      auth: "https://api.sandbox.ebay.com/identity/v1/oauth2/token"
      inventory: "https://api.sandbox.ebay.com/sell/inventory/v1"
      fulfillment: "https://api.sandbox.ebay.com/sell/fulfillment/v1"
    production:
      auth: "https://api.ebay.com/identity/v1/oauth2/token"
      inventory: "https://api.ebay.com/sell/inventory/v1"
      fulfillment: "https://api.ebay.com/sell/fulfillment/v1"

  # Default listing settings
  defaults:
    category_id: "377"  # Antiquarian & Collectible Books
    category_path: "Books & Magazines > Antiquarian & Collectible"
    listing_duration: "GTC"  # Good Til Cancelled
    listing_format: "FixedPrice"
    currency: "USD"
    country: "US"
    location: "United States"
    dispatch_time_max: 3

  # Business policies (set after OAuth setup)
  policies:
    payment_policy_id: null
    return_policy_id: null
    fulfillment_policy_id: null

  # CSV bulk upload settings
  csv:
    delimiter: ","
    encoding: "utf-8"
    max_title_length: 80
    max_description_length: 4000

# Website settings
website:
  title: "Muhlbauer Books LLC"
  tagline: "Rare & Collectible Books"
  theme: "retro-futurist"

  # Color palette (retro-futurist book aesthetic)
  colors:
    primary: "#1a1a2e"      # Deep space navy
    secondary: "#16213e"    # Midnight blue
    accent: "#e94560"       # Neon coral
    highlight: "#0f3460"    # Dark teal
    gold: "#d4af37"         # Antiquarian gold
    cream: "#f5f0e1"        # Aged paper
    text_light: "#eaeaea"
    text_dark: "#1a1a2e"

  # Typography
  fonts:
    heading: "'Playfair Display', Georgia, serif"
    body: "'Source Sans Pro', 'Segoe UI', sans-serif"
    mono: "'IBM Plex Mono', 'Courier New', monospace"

  features:
    show_pricing: false
    show_ebay_links: true
    enable_search: true
    enable_filters: true
    image_lightbox: true
    lazy_loading: true

# Data validation rules
validation:
  required_fields:
    - "basic_info.title"
    - "images.files"

  isbn_patterns:
    isbn_10: "^[0-9]{9}[0-9X]$"
    isbn_13: "^97[89][0-9]{10}$"

  condition_grades:
    - "NEW"
    - "LIKE_NEW"
    - "VERY_GOOD"
    - "GOOD"
    - "ACCEPTABLE"

# Search enrichment settings
search:
  enabled: true
  provider: "openrouter"  # openrouter, perplexity, serpapi

  # Provider settings
  providers:
    openrouter:
      model: "perplexity/sonar:online"  # Web search via OpenRouter
      max_tokens: 2000
      api_key_env: "OPENROUTER_API_KEY"
    perplexity:
      model: "sonar-pro"  # Direct Perplexity API
      max_tokens: 2000
      api_key_env: "PERPLEXITY_API_KEY"
    serpapi:
      engine: "google"
      num_results: 10
      api_key_env: "SERPAPI_API_KEY"

  # Query templates for different sources
  queries:
    ebay_completed:
      template: 'site:ebay.com "{title}" {edition_tags} {creator}'
      priority: 1
      description: "eBay completed listings for pricing and patterns"
    bibliographic:
      template: '"{title}" {author} publisher ISBN {year}'
      priority: 2
      description: "Bibliographic data lookup"
    abebooks:
      template: 'site:abebooks.com "{title}" {author} {edition_type}'
      priority: 3
      description: "AbeBooks for edition details"

  # Fields that can be searched
  searchable_fields:
    - publisher
    - place_of_publication
    - isbn_10
    - isbn_13
    - page_count
    - genre
    - publication_year
    - binding
    - comparable_prices

  # Confidence thresholds
  thresholds:
    auto_accept: 0.95    # Auto-accept matches above this confidence
    suggest: 0.70        # Show as suggestion above this
    minimum: 0.50        # Don't show matches below this

  # Source authority weights (higher = more trusted)
  source_authority:
    abebooks: 0.95
    worldcat: 0.95
    ebay: 0.90
    amazon: 0.85
    goodreads: 0.80
    web: 0.70

  # Rate limiting
  rate_limits:
    requests_per_minute: 30
    daily_limit: 500

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/app.log"
